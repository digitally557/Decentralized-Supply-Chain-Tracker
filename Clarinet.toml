[project]
name = "supply-chain-tracker"
description = "Decentralized Supply Chain Tracking System with Quality Verification"
authors = ["ChainTrack Team"]
telemetry = false
cache_dir = "./.clarinet"

[contracts.supply-chain]
path = "contracts/supply-chain.clar"
clarity_version = 2
epoch = 2.4

[repl]
costs_version = 2
parser_version = 2

[repl.analysis]
passes = ["check_checker"]

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false
